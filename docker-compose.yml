services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes: ["./credentials:/app/credentials:ro"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('db', 5432), 2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  webadmin:
    build: .
    command: ["uvicorn", "webadmin.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]     # только локально; наружу — через nginx+TLS
    restart: unless-stopped

volumes:
  pgdata:
